# Bun workspace configuration
# https://bun.sh/docs/install/workspaces

[install]
# Use hoisted linker for backward compatibility
# Packages are hoisted to root node_modules
linker = "hoisted"

[test]
# Isolate every test run from the developer's real ~/.upup (see scripts/test-preload.ts).
preload = ["./scripts/test-preload.ts"]
