# UpUp — 本地私有化部署(单节点,1 命令拉起)
# 用法: docker compose up -d
# 默认带 1 个 coach 通道(Server 酱,需 SC_KEY)+ 1 个 bridge 端口。

version: "3.9"

services:
  upup:
    build: .
    image: upup:2026.6.4
    container_name: upup
    restart: unless-stopped
    ports:
      - "8787:8787"   # Bridge WebSocket + 控制台
    environment:
      NODE_ENV: production
      UPUP_BRIDGE_HOST: 0.0.0.0
      UPUP_BRIDGE_PORT: 8787
      # 选择 LLM provider(以下三选一)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # 金融数据 API(任选)
      FINANCIAL_DATASETS_API_KEY: ${FINANCIAL_DATASETS_API_KEY:-}
      # 搜索(Exa 优先,Tavily 兜底)
      EXASEARCH_API_KEY: ${EXASEARCH_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Coach 推送(可选,微信 Server 酱)
      SC_KEY: ${SC_KEY:-}
    volumes:
      - upup-data:/app/.upup
    healthcheck:
      test: ["CMD", "sh", "-c", "./upup doctor || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  upup-data:
    driver: local
